# The actions in the workflows are pinned by commit SHA, so new versions do not arrive by themselves:
# Dependabot proposes them in a pull request, updating the SHA and its version comment together.
# The PowerShell tool pinned in the workflow (PSScriptAnalyzer) is not covered: bump it by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
